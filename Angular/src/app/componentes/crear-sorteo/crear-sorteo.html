<div class="min-h-screen bg-gray-50 py-10 px-4 sm:px-6 lg:px-8 font-sans">
  <div class="max-w-3xl mx-auto">

    <div class="text-center mb-10">
      <h1 class="text-5xl font-extrabold text-red-600 tracking-tight drop-shadow-sm">
        🎁 Amigo Invisible
      </h1>
      <p class="mt-4 text-lg text-gray-500">
        Organiza tu sorteo en segundos, sin registros y totalmente gratis.
      </p>
    </div>

    <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100">
      <div class="p-6 sm:p-10 space-y-8">

        <div>
          <h2 class="text-xl font-bold text-gray-800 border-b pb-2 mb-5">1. Detalles del Grupo</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Nombre del Grupo</label>
              <input type="text" [(ngModel)]="nombreGrupo" placeholder="Ej: Navidad Familia Pérez"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition shadow-sm bg-gray-50 focus:bg-white">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Presupuesto</label>
              <input type="text" [(ngModel)]="presupuesto" placeholder="Ej: 20€ - 30€"
                class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition shadow-sm bg-gray-50 focus:bg-white">
            </div>
          </div>
        </div>

        <div>
          <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center border-b pb-2 mb-5 gap-3">
            <h2 class="text-xl font-bold text-gray-800">2. Participantes</h2>
            <button (click)="agregarParticipante()" class="text-sm bg-green-100 text-green-700 font-bold py-2 px-4 rounded-lg hover:bg-green-200 transition shadow-sm">
              + Añadir amigo
            </button>
          </div>

          <div class="space-y-4">
            @for (amigo of participantes; track $index) {
              <div class="flex flex-col sm:flex-row gap-3 items-center bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition">

                <input type="text" [(ngModel)]="amigo.nombre" placeholder="Nombre"
                  class="w-full sm:w-1/3 border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-red-500 outline-none">

                <input type="email" [(ngModel)]="amigo.email" placeholder="Correo electrónico"
                  class="w-full sm:w-1/2 border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-red-500 outline-none">

                <button (click)="eliminarParticipante($index)" class="text-gray-400 hover:text-red-600 p-2 transition bg-white rounded-lg border border-gray-200 sm:border-none sm:bg-transparent">
                  <svg class="w-6 h-6 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                  </svg>
                </button>
              </div>
            }
          </div>
        </div>

        <div class="pt-6">
          <button (click)="crearGrupo()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-8 rounded-xl shadow-lg hover:shadow-red-500/30 transition transform hover:-translate-y-0.5 text-lg flex justify-center items-center gap-2">
            Crear Grupo y Obtener Enlace
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
          </button>
        </div>

      </div>
    </div>

  </div>
</div>
